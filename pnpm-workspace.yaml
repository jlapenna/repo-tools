allowBuilds:
  esbuild: true
  nx: false

# First-party publisher namespaces bypass release age, not other safety checks.
# Third-party dependencies, including their transitives, retain pnpm defaults.
minimumReleaseAgeExclude:
  - "@jlapenna/*"
  - "@supersprinklesracing/*"

# @nx/devkit's nx peer range also admits nx 24, so pnpm cannot select the
# patched 23.x release without an override. Scoped to the vulnerable range.
overrides:
  "nx@>=23.0.0 <23.2.1": 24.0.6
  # nx 23.3.1 (and 24.x) pin undici 7.29.0 exactly; no nx release carries
  # the patched 7.30.1 yet. Scoped to the vulnerable range.
  "undici@>=7.0.0 <7.30.1": 7.30.2
  # GHSA-g3hv-75wg-m249: eslint, @nx/devkit, nx and typescript-eslint still
  # declare minimatch ^10; the fix ships only in 11.x. Scoped to the
  # vulnerable range.
  "minimatch@>=7.0.0 <11.0.1": 11.0.8
  # nx calls minimatch.makeRe, which minimatch 11 removed; keep its pinned 10.x
  # until Nx moves to 11 (jlapenna/repo-tools#229).
  "nx>minimatch": 10.2.5
