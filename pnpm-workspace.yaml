allowBuilds:
  esbuild: true
  nx: false

# First-party publisher namespaces bypass release age, not other safety checks.
# Third-party dependencies, including their transitives, retain pnpm defaults.
minimumReleaseAgeExclude:
  - "@jlapenna/*"
  - "@supersprinklesracing/*"

# @nx/devkit's nx peer range also admits nx 24, so pnpm cannot select the
# patched 23.x release without an override. Scoped to the vulnerable range.
overrides:
  "nx@>=23.0.0 <23.2.1": 23.3.1
