name: LCARS review event

on:
  pull_request:
    types: [opened, reopened, synchronize, closed, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  notify:
    if: github.event_name == 'pull_request' || github.event.review.user.login == 'agent-lcars[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "LCARS review updated"
