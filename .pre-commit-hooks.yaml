- id: repo-require-worktree
  name: commits come from a feature worktree, not the primary checkout or main
  entry: bin/require-feature-worktree.sh
  language: unsupported_script
  minimum_pre_commit_version: 4.4.0
  pass_filenames: false
  always_run: true
  stages: [pre-commit]

- id: repo-require-worktree-push
  name: content pushes come from a feature worktree, not the primary checkout or main
  entry: bin/require-feature-worktree.sh pushes
  language: unsupported_script
  minimum_pre_commit_version: 4.4.0
  pass_filenames: false
  always_run: true
  stages: [pre-push]

- id: repo-check-runner-labels
  name: runs-on never pairs self-hosted with a declared runner scale-set label
  entry: bin/check-runner-labels.mjs
  language: unsupported_script
  minimum_pre_commit_version: 4.4.0
  files: ^\.github/(workflows/[^/]+\.ya?ml|actionlint\.ya?ml)$
  stages: [pre-commit]

# Checks every tracked file (not just the staged ones) so the repository's
# inventory of sub-hourly schedules stays complete and explicit.
- id: repo-check-schedules
  name: schedules more frequent than hourly carry a schedule-justification comment
  entry: bin/check-schedules.mjs
  language: unsupported_script
  minimum_pre_commit_version: 4.4.0
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
